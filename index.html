    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"XCROL","url":"https://xcrol.com/","description":"Not Being Used to Control You. Build connections, shape your world, and own your digital presence."}
    </script>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"XCROL","url":"https://xcrol.com/","logo":"https://xcrol.com/favicon.png"}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <div id="top-banner" style="position:fixed;top:48px;left:0;width:100%;background:#1a1a2e;color:#e0e0e0;font-size:14px;line-height:1.5;padding:10px 20px;text-align:center;box-sizing:border-box;font-family:system-ui,sans-serif;z-index:40;">
      I'm <a href="https://chrisdamitio.com" style="color:#a78bfa;text-decoration:underline;">CD</a>. I created Xcrol as my private social network. You can use it too. <strong>No spying. No ads. Just real people.</strong> Come talk about <a href="https://baoism.org" style="color:#a78bfa;text-decoration:underline;">Baoism</a>, travel, books, and <a href="https://indignified.substack.com" style="color:#a78bfa;text-decoration:underline;">finding actual freedom</a>.
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        var b=document.getElementById('top-banner');
        function toggle(){if(b) b.style.display=window.location.pathname==='/'?'':'none';}
        toggle();
        var _push=history.pushState, _replace=history.replaceState;
        history.pushState=function(){_push.apply(this,arguments);toggle();};
        history.replaceState=function(){_replace.apply(this,arguments);toggle();};
        window.addEventListener('popstate',toggle);
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            // Pull auth/cache fixes promptly instead of waiting for the browser's
            // normal service-worker update cadence.
            registration.update().catch(() => {});
          }).catch(() => {});
        });
      }
    </script>
  </body>
