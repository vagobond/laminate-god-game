# Worklist #6: uptime monitoring.
# Pings the public frontend and the health edge function every 30 minutes.
# If either check fails, the run fails and GitHub emails the workflow actor
# (whoever last touched this file — i.e. CD). No third-party accounts,
# no secrets, nothing to maintain.
#
# Notes:
# - The health function (supabase/functions/health) returns 200 only when
#   the database is reachable; backup freshness is informational in the body.
# - curl retries twice with a 15s gap so a single transient blip on the
#   runner's network doesn't page anyone.
# - GitHub disables cron workflows after 60 days of repo inactivity; any
#   commit re-enables them. See docs/RUNBOOK.md.

name: Uptime check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Frontend (xcrol.com)
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 15 --retry-all-errors --max-time 30 https://xcrol.com)
          echo "xcrol.com -> HTTP $code"
          test "$code" = "200"

      - name: Backend health (Supabase edge function)
        run: |
          body=$(curl -sS --retry 2 --retry-delay 15 --retry-all-errors --max-time 30 https://wmatvlxehyaufhjljtby.supabase.co/functions/v1/health)
          echo "$body"
          echo "$body" | grep -q '"status":"healthy"'

  # Worklist/backlog #14a: auth-config drift guard (DETECTION ONLY).
  # Auth URL config is dashboard-only state no file enforces (config.toml has no
  # [auth] section, deliberately: `supabase config push` would overwrite the ~19
  # live settings and silently kill custom SMTP, Google OAuth, and the customized
  # email templates). That drift is exactly what broke password reset after the
  # 08-17 cutover. This job can page, never change anything.
  auth-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Auth config drift guard
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          cfg=$(curl -sS --retry 2 --retry-delay 15 --retry-all-errors --max-time 30             -H "Authorization: Bearer $TOKEN"             "https://api.supabase.com/v1/projects/$REF/config/auth")
          site=$(echo "$cfg" | jq -r '.site_url // .SITE_URL // empty')
          allow=$(echo "$cfg" | jq -r '.uri_allow_list // .URI_ALLOW_LIST // empty')
          echo "site_url=$site"
          echo "uri_allow_list=$allow"
          if [ "$site" != "https://xcrol.com" ]; then
            echo "::error::site_url drifted: $site (expected https://xcrol.com)"; exit 1
          fi
          for needle in "https://xcrol.com" "https://www.xcrol.com" "workers.dev"; do
            case "$allow" in
              *"$needle"*) : ;;
              *) echo "::error::redirect allow-list missing: $needle"; exit 1 ;;
            esac
          done
